services:
  efdna-nessie-catalog:
    image: projectnessie/nessie:0.76.0
    container_name: efdna-nessie-catalog
    networks:
      - efdna-network
    ports:
      - "19120:19120"

  efdna-minio-storage:
    image: quay.io/minio/minio
    container_name: efdna-minio-storage
    volumes:
      - ./data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    networks:
      - efdna-network
    ports:
      - "9001:9001"
      - "9000:9000"
    command: ["server", "/data", "--console-address", ":9001"]

  efdna-trino:
    image: trinodb/trino:latest
    container_name: efdna-trino
    ports:
      - "8080:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog
    networks:
      - efdna-network

  efdna-starrocks-ui:
    image: starrocks/fe-ubuntu:4.0-latest
    container_name: efdna-starrocks-ui
    hostname: efdna-starrocks-ui
    user: root
    command: |
      bash /opt/starrocks/fe/bin/start_fe.sh --host_type FQDN
    ports:
      - "8030:8030"
      - "9010:9010"
      - "9030:9030"
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_REGION=us-east-1
    networks:
      - efdna-network
    healthcheck:
      test: 'mysql -u root -h efdna-starrocks-ui -P 9030 -e "SHOW FRONTENDS\\G" | grep "Alive: true"'
      interval: 10s
      timeout: 5s
      retries: 10

  efdna-starrocks-service:
    image: starrocks/be-ubuntu:4.0-latest
    container_name: efdna-starrocks-service
    hostname: efdna-starrocks-service
    user: root
    depends_on:
      efdna-starrocks-ui:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - |
        ulimit -n 65535;
        sleep 15s;
        mysql --connect-timeout 2 -h efdna-starrocks-ui -P 9030 -u root -e "ALTER SYSTEM ADD BACKEND \"efdna-starrocks-service:9050\";";
        bash /opt/starrocks/be/bin/start_be.sh
    ports:
      - "8040:8040"
      - "9050:9050"
    environment:
      - HOST_TYPE=FQDN
      - AWS_EC2_METADATA_DISABLED=true
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_REGION=us-east-1
    networks:
      - efdna-network
    healthcheck:
      test: 'mysql -u root -h efdna-starrocks-ui -P 9030 -e "SHOW BACKENDS\\G" | grep "Alive: true"'
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  efdna-network: {}

